<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TASK AI</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f3f4f6;color:#222;max-width:700px;margin:auto;padding:16px}
.card{background:white;padding:16px;border-radius:14px;margin:14px 0}h1{margin:4px 0}h2{font-size:18px;margin:0 0 12px}.sub,.note,.meta{color:#777;font-size:12px}
textarea,input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:16px system-ui;margin:6px 0 12px}textarea{min-height:100px}
button{padding:11px 14px;border:0;border-radius:8px;background:#222;color:white;font-size:14px;margin:3px 4px 3px 0}.alt{background:#e9eaec;color:#222}.green{background:#287c54}
.msg{padding:11px 13px;border-radius:12px;margin:9px 0;white-space:pre-wrap;line-height:1.5;font-size:14px}.ai{background:#f0f2f5}.me{background:#e5f2ff;margin-left:12%}
.result{background:#f4f9f5;border-left:4px solid #287c54;padding:11px;margin:10px 0;font-size:14px;line-height:1.55}.result b{display:block;margin-bottom:4px}.hidden{display:none}.task{border-top:1px solid #eee;padding:12px 0}
</style><body>
<h1>TASK AI</h1><div class="sub">YOUR PERSONAL DECISION ENGINE</div>
<section class="card">
<h2>仕事の詰まりを解消する</h2><p class="note">状況をそのまま書け。整理されていなくていい。質問は一つずつ行う。</p>
<textarea id="s" placeholder="例：Aを決めたいが、別の運用が決まらず進められない"></textarea>
<button onclick="start()">この仕事を整理する</button><button class="alt" onclick="example()">今回の例を入力</button>
<div class="note">Gemini Worker URL</div><input id="api" type="url" placeholder="https://task-ai-api.example.workers.dev/api/chat"><button class="alt" onclick="saveApi()">接続先を保存</button><div id="chat"></div><div id="qa" class="hidden"><b id="q"></b><div id="opts"></div><textarea id="a" placeholder="回答を入力" style="min-height:60px"></textarea><button onclick="answer()">回答する</button></div>
<div id="out"></div><button id="again" class="alt hidden" onclick="reset()">別の仕事を相談する</button>
<p class="note">※相談内容は設定したWorker経由でGeminiに送信される。APIキーはこのページに保存されない。</p>
</section>
<section class="card"><h2>仕事を登録する</h2><input id="name" placeholder="仕事の名前・内容"><label>期限</label><input id="date" type="date"><label>重要度</label><select id="imp"><option value="1">低い</option><option value="2" selected>普通</option><option value="3">高い</option></select><label>緊急度</label><select id="urg"><option value="1">低い</option><option value="2" selected>普通</option><option value="3">高い</option></select><label>不確実性</label><select id="unc"><option value="1">低い</option><option value="2" selected>普通</option><option value="3">高い</option></select><button onclick="add()">仕事を追加</button></section>
<section class="card"><h2>今やるべき仕事</h2><div id="rec"></div></section><section class="card"><h2>仕事一覧</h2><div id="tasks"></div></section>
<script>
let tasks=JSON.parse(localStorage.getItem('tasks')||'[]').map(t=>({...t,imp:t.imp??t.importance??2,urg:t.urg??t.urgency??2,unc:t.unc??t.uncertainty??2})),history=[];
const $=id=>document.getElementById(id);
$('api').value=localStorage.getItem('geminiWorkerUrl')||'';
function saveApi(){const value=$('api').value.trim();if(value&&!/^https:\/\//i.test(value))return alert('https:// から始まるWorker URLを入力してください');localStorage.setItem('geminiWorkerUrl',value);alert('接続先を保存しました');}
function example(){$('s').value='Aの標準を制定する必要があるが、別の運用が決まらないとこちらも決められない。別の運用では管理者の任命と棚卸し内容を決める必要がある。A側は仮置き済み。'}
function msg(t,who='ai'){let d=document.createElement('div');d.className='msg '+who;d.textContent=t;$('chat').append(d);d.scrollIntoView({block:'nearest'})}
function addResult(label,text){const d=document.createElement('div');d.className='result';const b=document.createElement('b');b.textContent=label;const p=document.createElement('div');p.textContent=text||'特定できていない';d.append(b,p);$('out').append(d)}
function showAnalysis(data){$('qa').classList.add('hidden');$('out').innerHTML='';addResult('詰まりの構造',data.blockage);addResult('依存している事項',data.dependencies);addResult('不足している情報・判断',data.missing);addResult('次の一手',data.next_action);addResult('なぜ今それをやるか',data.why_now);$('again').classList.remove('hidden')}
function showQuestion(data){$('qa').classList.remove('hidden');$('q').textContent=data.question;$('opts').innerHTML='';(Array.isArray(data.choices)?data.choices.slice(0,4):[]).forEach(x=>{const b=document.createElement('button');b.className='alt';b.textContent=x;b.onclick=()=>{$('a').value=x;answer()};$('opts').append(b)});$('a').focus()}
async function sendTurn(text){const url=$('api').value.trim();if(!url){alert('Gemini Worker URLを設定してください');return}history.push({role:'user',text});$('qa').classList.add('hidden');$('out').innerHTML='';msg('Geminiが状況を整理しています…');
try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'APIリクエストに失敗しました');const data=payload.result;if(!data||!['question','analysis'].includes(data.type))throw new Error('APIから不正な応答が返りました');history.push({role:'model',text:JSON.stringify(data)});$('chat').lastChild.remove();if(data.type==='question'){msg(data.question);showQuestion(data)}else{['blockage','dependencies','missing','next_action','why_now'].forEach(k=>{if(typeof data[k]!=='string')throw new Error('分析結果の形式が正しくありません')});msg('状況を整理しました。');showAnalysis(data)}}catch(e){$('chat').lastChild?.remove();history.pop();msg('接続できませんでした。Worker URL、Workerの設定、通信状況を確認してください。');alert(e.message)}}
function start(){const t=$('s').value.trim();if(!t)return alert('状況を書いてください');history=[];$('chat').innerHTML='';$('out').innerHTML='';$('again').classList.add('hidden');msg(t,'me');sendTurn(t)}
function answer(){const a=$('a').value.trim();if(!a)return alert('回答を選ぶか入力してください');$('a').value='';msg(a,'me');sendTurn(a)}
function reset(){$('s').value='';$('chat').innerHTML='';$('out').innerHTML='';$('qa').classList.add('hidden');$('again').classList.add('hidden');history=[]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function score(t){let d=99;if(t.date){let n=new Date();n.setHours(0,0,0,0);d=Math.ceil((new Date(t.date+'T00:00:00')-n)/86400000)}return t.imp*3+t.urg*3+t.unc*2+(d<=1?5:d<=3?4:d<=7?3:d<=14?2:1)*2}
function save(){localStorage.setItem('tasks',JSON.stringify(tasks));render()}
function add(){let n=$('name').value.trim();if(!n)return alert('仕事の名前を入力しろ');tasks.push({id:Date.now(),name:n,date:$('date').value,imp:+$('imp').value,urg:+$('urg').value,unc:+$('unc').value,active:false});$('name').value='';save()}
function activate(id){let t=tasks.find(x=>x.id===id);if(!t)return;if(!t.active&&tasks.filter(x=>x.active).length>=2)return alert('同時進行は最大2件だ');t.active=!t.active;save()}
function done(id){tasks=tasks.filter(t=>t.id!==id);save()}
function render(){tasks.sort((a,b)=>score(b)-score(a));let pick=[...tasks.filter(t=>t.active)];for(let t of tasks.filter(t=>!t.active)){if(pick.length<2)pick.push(t)}$('rec').innerHTML=pick.length?pick.map((t,i)=>'<div class="task"><b>'+(i+1)+'. '+esc(t.name)+'</b><div class="meta">判断スコア '+score(t)+'点 '+(t.active?'・実行中':'・候補')+'</div></div>').join(''):'仕事を登録しろ。判断はそこから始まる。';$('tasks').innerHTML=tasks.length?tasks.map(t=>'<div class="task"><b>'+esc(t.name)+'</b><div class="meta">期限 '+(t.date||'未設定')+' ・ スコア '+score(t)+'</div><button class="'+(t.active?'alt':'')+'" onclick="activate('+t.id+')">'+(t.active?'実行中を解除':'今やる仕事にする')+'</button><button class="green" onclick="done('+t.id+')">完了</button></div>').join(''):'登録された仕事はない'}
render();
</script></body></html>
